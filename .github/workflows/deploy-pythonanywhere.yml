name: Deploy to PythonAnywhere

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy.sh on PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
        run: |
          set -euo pipefail
          API="https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}"
          AUTH="Authorization: Token ${PA_TOKEN}"

          # Wraps a curl call, always writing status+body to separate files so
          # a network-level curl failure (empty response) is distinguishable
          # from a real HTTP error status, instead of silently falling through
          # to "success" the way a bare `-w`/`tail`/`[ -ge ]` pipeline can under
          # `set -e` (a failing arithmetic test inside an `if` doesn't trip -e).
          api_call() {
            local out_body="$1"; shift
            local status
            status=$(curl -s -o "$out_body" -w "%{http_code}" "$@") || { echo "curl itself failed (network error)"; return 1; }
            if [ -z "$status" ] || ! [ "$status" -eq "$status" ] 2>/dev/null; then
              echo "curl returned no usable HTTP status"
              return 1
            fi
            echo "$status"
          }

          echo "Creating a fresh console for this deploy..."
          CREATE_STATUS=$(api_call /tmp/create_body.json -X POST -H "$AUTH" \
            -d "executable=bash" \
            -d "working_directory=/home/${PA_USERNAME}/bhatsfinance" \
            "${API}/consoles/") || { cat /tmp/create_body.json 2>/dev/null; exit 1; }
          if [ "$CREATE_STATUS" -ge 300 ]; then
            echo "Console creation failed (HTTP $CREATE_STATUS):"
            cat /tmp/create_body.json
            exit 1
          fi
          CONSOLE_ID=$(python3 -c "import json;print(json.load(open('/tmp/create_body.json'))['id'])")
          echo "Console ID: $CONSOLE_ID"

          # Give the console a moment to actually spin up before sending input.
          sleep 5

          DONE_MARKER="__DEPLOY_DONE_${GITHUB_SHA}__"
          INPUT_LINE="bash deploy.sh; echo ${DONE_MARKER} \$?"$'\n'
          SEND_STATUS=$(api_call /tmp/send_body.json -X POST -H "$AUTH" \
            --data-urlencode "input=${INPUT_LINE}" \
            "${API}/consoles/${CONSOLE_ID}/send_input/") || { cat /tmp/send_body.json 2>/dev/null; exit 1; }
          if [ "$SEND_STATUS" -ge 300 ]; then
            echo "send_input failed (HTTP $SEND_STATUS):"
            cat /tmp/send_body.json
            exit 1
          fi

          echo "Polling for completion (up to 5 minutes)..."
          for i in $(seq 1 60); do
            sleep 5
            POLL_STATUS=$(api_call /tmp/poll_body.json -H "$AUTH" "${API}/consoles/${CONSOLE_ID}/get_latest_output/") || { echo "poll request failed, retrying"; continue; }
            if [ "$POLL_STATUS" -ge 300 ]; then
              echo "get_latest_output failed (HTTP $POLL_STATUS):"
              cat /tmp/poll_body.json
              continue
            fi
            OUTPUT=$(python3 -c "import json;print(json.load(open('/tmp/poll_body.json'))['output'])")
            if echo "$OUTPUT" | grep -q "$DONE_MARKER"; then
              EXIT_CODE=$(echo "$OUTPUT" | grep -o "${DONE_MARKER} [0-9]*" | tail -1 | awk '{print $2}')
              echo "----- deploy.sh output -----"
              echo "$OUTPUT"
              echo "-----------------------------"
              if [ "$EXIT_CODE" != "0" ]; then
                echo "deploy.sh exited with code $EXIT_CODE"
                exit 1
              fi
              echo "deploy.sh completed successfully."
              DEPLOY_OK=1
              break
            fi
          done

          curl -sf -X DELETE -H "$AUTH" "${API}/consoles/${CONSOLE_ID}/" || true

          if [ -z "${DEPLOY_OK:-}" ]; then
            echo "Timed out waiting for deploy.sh to finish."
            exit 1
          fi

      - name: Reload web app
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
        run: |
          set -euo pipefail
          curl -sf -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}/webapps/${PA_DOMAIN}/reload/"
          echo "Web app reload triggered."
