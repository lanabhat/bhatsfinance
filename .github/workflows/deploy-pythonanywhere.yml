name: Deploy to PythonAnywhere

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy.sh on PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
          PA_CONSOLE_ID: ${{ secrets.PYTHONANYWHERE_DEPLOY_CONSOLE_ID }}
        run: |
          set -euo pipefail
          API="https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}"
          AUTH="Authorization: Token ${PA_TOKEN}"

          # Wraps a curl call, always writing status+body to a file so a
          # network-level curl failure (empty response) is distinguishable
          # from a real HTTP error status, instead of silently falling through
          # to "success" the way a bare `-w`/`tail`/`[ -ge ]` pipeline can under
          # `set -e` (a failing arithmetic test inside an `if` doesn't trip -e).
          api_call() {
            local out_body="$1"; shift
            local status curl_exit
            set +e
            status=$(curl -sS -o "$out_body" -w "%{http_code}" "$@" 2>/tmp/curl_stderr.log)
            curl_exit=$?
            set -e
            if [ "$curl_exit" != "0" ]; then
              echo "curl failed with exit code $curl_exit:" >&2
              cat /tmp/curl_stderr.log >&2
              return 1
            fi
            echo "$status"
          }

          echo "Verifying deploy console $PA_CONSOLE_ID exists..."
          CHECK_STATUS=$(api_call /tmp/check_body.json -H "$AUTH" "${API}/consoles/${PA_CONSOLE_ID}/") || { cat /tmp/check_body.json 2>/dev/null; exit 1; }
          if [ "$CHECK_STATUS" -ge 300 ]; then
            echo "Console $PA_CONSOLE_ID is not reachable (HTTP $CHECK_STATUS):"
            cat /tmp/check_body.json
            echo "Create a dedicated console in the PythonAnywhere Consoles tab and update the PYTHONANYWHERE_DEPLOY_CONSOLE_ID secret with its id."
            exit 1
          fi
          echo "Console reachable."

          # A reused console may be sitting at a stale/mid-typed prompt from a
          # previous run or manual use, so clear the line before sending the
          # real command rather than assuming a clean shell.
          echo "Clearing the console's input line..."
          curl -s -X POST -H "$AUTH" --data-urlencode "input=$(printf '\x03')" \
            "${API}/consoles/${PA_CONSOLE_ID}/send_input/" >/dev/null || true
          sleep 1

          START_MARKER="__DEPLOY_START_${GITHUB_SHA}__"
          DONE_MARKER="__DEPLOY_DONE_${GITHUB_SHA}__"
          INPUT_LINE="echo ${START_MARKER}; cd /home/${PA_USERNAME}/bhatsfinance && bash deploy.sh; echo ${DONE_MARKER} \$?"$'\n'
          SEND_STATUS=$(api_call /tmp/send_body.json -X POST -H "$AUTH" \
            --data-urlencode "input=${INPUT_LINE}" \
            "${API}/consoles/${PA_CONSOLE_ID}/send_input/") || { cat /tmp/send_body.json 2>/dev/null; exit 1; }
          if [ "$SEND_STATUS" -ge 300 ]; then
            echo "send_input failed (HTTP $SEND_STATUS):"
            cat /tmp/send_body.json
            exit 1
          fi

          echo "Polling for completion (up to 5 minutes)..."
          for i in $(seq 1 60); do
            sleep 5
            POLL_STATUS=$(api_call /tmp/poll_body.json -H "$AUTH" "${API}/consoles/${PA_CONSOLE_ID}/get_latest_output/") || { echo "poll request failed, retrying"; continue; }
            if [ "$POLL_STATUS" -ge 300 ]; then
              echo "get_latest_output failed (HTTP $POLL_STATUS):"
              cat /tmp/poll_body.json
              continue
            fi
            OUTPUT=$(python3 -c "import json;print(json.load(open('/tmp/poll_body.json'))['output'])")
            if ! echo "$OUTPUT" | grep -q "$START_MARKER"; then
              # This run's command hasn't started echoing yet (or the console's
              # scrollback rolled it out of the tail PythonAnywhere returns) —
              # keep waiting rather than risk matching a stale DONE_MARKER.
              continue
            fi
            RUN_OUTPUT=$(echo "$OUTPUT" | awk -v m="$START_MARKER" '$0 ~ m {found=1} found')
            if echo "$RUN_OUTPUT" | grep -q "$DONE_MARKER"; then
              EXIT_CODE=$(echo "$RUN_OUTPUT" | grep -o "${DONE_MARKER} [0-9]*" | tail -1 | awk '{print $2}')
              echo "----- deploy.sh output -----"
              echo "$RUN_OUTPUT"
              echo "-----------------------------"
              if [ "$EXIT_CODE" != "0" ]; then
                echo "deploy.sh exited with code $EXIT_CODE"
                exit 1
              fi
              echo "deploy.sh completed successfully."
              DEPLOY_OK=1
              break
            fi
          done

          if [ -z "${DEPLOY_OK:-}" ]; then
            echo "Timed out waiting for deploy.sh to finish."
            exit 1
          fi

      - name: Reload web app
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
        run: |
          set -euo pipefail
          curl -sf -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}/webapps/${PA_DOMAIN}/reload/"
          echo "Web app reload triggered."
