name: Mirror AMFI SIF NAVs

# PythonAnywhere free accounts can't reach www.amfiindia.com, where SIF NAVs are
# published (mfapi.in doesn't carry SIFs). This copies AMFI's daily SIF file to the
# `sif-nav-data` branch, which the app reads via raw.githubusercontent.com (on the
# free allowlist) when AMFI itself is blocked — see fund_data/amfi_sif_client.py.
# Pushing to that branch doesn't trigger the main-branch deploy.

on:
  schedule:
    - cron: '30 16 * * *'   # 22:00 IST, after AMFI publishes the day's NAVs
    - cron: '30 1 * * *'    # 07:00 IST, catches late updates
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download SIF NAV file from AMFI
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -A "Mozilla/5.0" -o SIF_NAVAll.txt https://www.amfiindia.com/spages/SIF_NAVAll.txt
          # Refuse to publish an error page or an empty file.
          rows=$(grep -c '^SIF-' SIF_NAVAll.txt || true)
          echo "SIF rows: $rows"
          if [ "$rows" -lt 5 ]; then
            echo "Downloaded file doesn't look like the SIF NAV list:"; head -c 500 SIF_NAVAll.txt; exit 1
          fi

      - name: Publish to the sif-nav-data branch if changed
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir publish && cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 "$remote" sif-nav-data 2>/dev/null; then
            git checkout -q -B sif-nav-data FETCH_HEAD
          else
            git checkout -q --orphan sif-nav-data
          fi
          cp ../SIF_NAVAll.txt SIF_NAVAll.txt
          git add SIF_NAVAll.txt
          if git diff --cached --quiet; then
            echo "No change since the last copy."
            exit 0
          fi
          git commit -q -m "SIF NAVs $(date -u +%Y-%m-%d)"
          git push -q "$remote" sif-nav-data
          echo "Published."
